<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORWARD — Din utveckling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05050a; --bg2:#0a0a12; --card:#0e0e18; --card2:#151522;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16);
  --text:#f4f3f9; --muted:#a3a2b3; --label:#71708a;
  --accent:#7c83ff; --accent2:#9a7cff; --grad2:#4fd1ff;
  --accent-dim:rgba(124,131,255,.14);
  --good:#3ddc97; --bad:#ff6b7a; --warn:#ffc857; --danger:#ff6b7a; --text3:#8f8ea1;
  --font:'Inter',system-ui,sans-serif; --font-display:'Space Grotesk',system-ui,sans-serif;
  --radius:20px; --radius-s:12px;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  --glow:0 0 28px rgba(124,131,255,.35);
}
:root[data-theme="light"]{
  --bg:#f5f4ef; --bg2:#ffffff; --card:#ffffff; --card2:#f2f1ea;
  --border:rgba(20,20,40,.09); --border-strong:rgba(20,20,40,.18);
  --text:#18171e; --muted:#5f5e6e; --label:#8b8a99; --text3:#7b7a88;
  --accent:#555ad6; --accent-dim:rgba(85,90,214,.10);
  --shadow:0 10px 30px rgba(30,30,60,.08); --glow:none;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth; scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  line-height:1.55; height:100%; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,textarea,select{font-family:inherit; color:inherit;}
a{color:var(--accent); text-decoration:none;}
::selection{background:var(--accent-dim);}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:99px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Ambience ---------- */
#bg-aurora{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
#bg-aurora .blob{position:absolute; border-radius:50%; filter:blur(100px); opacity:.45;}
#bg-aurora .b1{width:560px; height:560px; background:radial-gradient(circle,#7c83ff,transparent 65%); top:-180px; left:-140px; animation:drift1 26s ease-in-out infinite alternate;}
#bg-aurora .b2{width:480px; height:480px; background:radial-gradient(circle,#4fd1ff,transparent 65%); bottom:-160px; right:-120px; animation:drift2 32s ease-in-out infinite alternate;}
#bg-aurora .b3{width:360px; height:360px; background:radial-gradient(circle,#9a7cff,transparent 65%); top:40%; left:55%; opacity:.3; animation:drift3 38s ease-in-out infinite alternate;}
[data-theme="light"] #bg-aurora .blob{opacity:.15;}
@keyframes drift1{to{transform:translate(70px,50px) scale(1.1);}}
@keyframes drift2{to{transform:translate(-60px,-40px) scale(1.12);}}
@keyframes drift3{to{transform:translate(-70px,36px) scale(.94);}}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
@keyframes popIn{from{opacity:0; transform:scale(.94);} to{opacity:1; transform:scale(1);}}

/* ---------- Shell ---------- */
#app{position:relative; z-index:1; display:flex; min-height:100vh;}
#sidebar{
  width:240px; flex-shrink:0; position:fixed; top:0; bottom:0; left:0; z-index:40;
  padding:26px 16px 20px; display:flex; flex-direction:column; gap:3px;
  background:rgba(10,10,18,.6); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-right:1px solid var(--border);
}
:root[data-theme="light"] #sidebar{background:rgba(255,255,255,.65);}
.brand{
  font-family:var(--font-display); font-weight:800; font-size:1.3rem; letter-spacing:.06em;
  padding:2px 10px 24px; display:flex; align-items:center; gap:9px;
  background:linear-gradient(120deg,var(--text) 30%,var(--accent));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.brand .dot{width:9px; height:9px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--grad2));
  box-shadow:0 0 12px rgba(124,131,255,.9); flex:none;}
.navlink{
  display:flex; align-items:center; gap:12px; padding:10px 13px; border-radius:12px;
  color:var(--muted); font-size:.92rem; font-weight:500; cursor:pointer;
  border:none; background:none; width:100%; text-align:left;
  transition:color .15s ease, background .15s ease; position:relative;
}
.navlink:hover{color:var(--text); background:var(--card2);}
.navlink.active{color:var(--text); background:var(--accent-dim); font-weight:600;}
.navlink.active::before{
  content:''; position:absolute; left:-16px; top:22%; bottom:22%; width:3px; border-radius:99px;
  background:linear-gradient(180deg,var(--accent),var(--grad2)); box-shadow:var(--glow);
}
.navlink svg{width:18px; height:18px; flex-shrink:0;}
#sidebar .bottom{margin-top:auto; padding-top:14px; border-top:1px solid var(--border);}
#bottomnav{
  display:none; position:fixed; left:10px; right:10px; bottom:10px; z-index:50;
  justify-content:space-around; padding:7px 4px; border-radius:20px;
  background:rgba(10,10,18,.8); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border); box-shadow:var(--shadow);
}
:root[data-theme="light"] #bottomnav{background:rgba(255,255,255,.85);}
#bottomnav .navlink{flex-direction:column; gap:3px; font-size:.6rem; padding:7px 6px; border-radius:14px; width:auto; color:var(--label);}
#bottomnav .navlink.active{color:var(--accent); background:transparent;}
#bottomnav .navlink.active::before{display:none;}
#bottomnav svg{width:20px; height:20px;}
main{position:relative; z-index:1; flex:1; min-width:0; margin-left:240px; padding:36px 44px 80px; max-width:1060px;}
@media(max-width:860px){
  #sidebar{display:none;}
  main{margin-left:0; padding:20px 16px 120px;}
  #bottomnav{display:flex;}
}
.view{display:none;}
.view.active{display:block; animation:fadeUp .35s ease;}

/* ---------- Type ---------- */
h1{font-family:var(--font-display); font-size:2.2rem; font-weight:800; letter-spacing:-.02em; margin:6px 0 2px;}
h2{font-family:var(--font-display); font-size:1.2rem; font-weight:700; letter-spacing:-.01em; margin:30px 0 0;}
h3{font-family:var(--font-display); font-size:.8rem; text-transform:uppercase; letter-spacing:.07em; color:var(--label); font-weight:600; margin:0 0 10px;}
h1 + .sub{margin-bottom:6px;}
.sub{color:var(--muted); font-size:.95rem; margin-top:4px;}
.date{color:var(--label); font-size:.8rem; text-transform:uppercase; letter-spacing:.14em; margin-bottom:2px;}
.big{font-family:var(--font-display); font-size:2rem; font-weight:800; letter-spacing:-.02em; line-height:1.2;}
.meta{color:var(--muted); font-size:.82rem;}
.title{font-weight:600;}
.label{color:var(--label); font-size:.8rem; margin-top:2px;}
.empty{color:var(--muted); padding:30px 14px; text-align:center; border:1px dashed var(--border-strong); border-radius:var(--radius); margin-top:16px; font-size:.9rem;}
.empty .btn{margin-top:12px;}

/* ---------- Cards & grids ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; margin-top:22px;}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px;}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:22px; margin-top:16px; box-shadow:var(--shadow);
  transition:border-color .2s ease, transform .2s ease;
}
.card:hover{border-color:var(--border-strong);}
.card h3{margin:0 0 10px;}
.hero-card{position:relative; overflow:hidden; background:linear-gradient(135deg,var(--card) 40%,rgba(124,131,255,.07));}
.hero-card::before{content:''; position:absolute; top:-45%; right:-12%; width:280px; height:280px;
  background:radial-gradient(circle,rgba(124,131,255,.16),transparent 70%); border-radius:50%; pointer-events:none;}
.list-item{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-top:14px;}
.list-item .meta{margin-top:2px;}

/* ---------- Buttons & forms ---------- */
.btn{
  font-family:var(--font-display); font-weight:600; font-size:.88rem;
  padding:11px 20px; border-radius:12px; border:none; cursor:pointer;
  background:linear-gradient(120deg,var(--accent),var(--accent2)); color:#fff;
  box-shadow:0 4px 16px rgba(124,131,255,.3);
  transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
}
.btn:hover{transform:translateY(-1px); box-shadow:0 6px 20px rgba(124,131,255,.4);}
.btn:active{transform:translateY(0);}
.btn.ghost{background:transparent; color:var(--text); border:1px solid var(--border-strong); box-shadow:none;}
.btn.ghost:hover{background:var(--card2); transform:none;}
.btn.danger{background:linear-gradient(120deg,#e0566a,#c74459); box-shadow:0 4px 16px rgba(224,86,106,.25);}
button{font-size:.9rem;}
input,select,textarea{
  font-size:.92rem; color:var(--text);
  background:var(--card2); border:1px solid var(--border); border-radius:11px; padding:11px 13px;
  outline:none; transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim);}
label{font-size:.76rem; color:var(--label); display:block; margin-bottom:5px; text-transform:uppercase; letter-spacing:.06em; font-weight:600;}
.field{margin-bottom:14px;}
.fieldrow{display:flex; gap:14px; flex-wrap:wrap;}
.fieldrow .field{flex:1; min-width:130px;}
.panel{
  display:none; margin-top:14px; padding:20px; border-radius:var(--radius);
  background:var(--card2); border:1px solid var(--border);
}
.panel.open{display:block; animation:fadeUp .25s ease;}
input[type=range]{accent-color:var(--accent); height:6px; padding:0; border:none; background:transparent;}
input[type=range]:focus{box-shadow:none;}

/* ---------- Bits ---------- */
.tag{
  display:inline-block; padding:4px 11px; border-radius:999px; font-size:.74rem; font-weight:500;
  background:var(--card2); border:1px solid var(--border); color:var(--muted); margin:2px 5px 2px 0;
}
.icobox{width:40px; height:40px; border-radius:13px; display:flex; align-items:center; justify-content:center;
  background:var(--accent-dim); color:var(--accent); margin-bottom:12px;}
.icobox svg{width:20px; height:20px;}
.pr-badge{
  display:inline-flex; align-items:center; gap:6px; font-size:.74rem; font-weight:700;
  background:var(--accent-dim); border:1px solid rgba(124,131,255,.3); color:var(--accent);
  padding:5px 13px; border-radius:999px; animation:popIn .4s ease;
}
.bar-track{background:var(--card2); border-radius:99px; height:9px; overflow:hidden; margin-top:6px; border:1px solid var(--border);}
.bar-fill{background:linear-gradient(90deg,var(--accent),var(--grad2)); height:100%; border-radius:99px;
  box-shadow:0 0 12px rgba(124,131,255,.5); transition:width .5s ease;}
.ring{transform:rotate(-90deg);}
.ring circle{fill:none; stroke-linecap:round;}
.heatmap{display:grid; grid-template-columns:repeat(10,1fr); gap:4px; margin-top:12px;}
.hm-cell{aspect-ratio:1; border-radius:4px; background:var(--card2);}
.hm-cell.on{background:linear-gradient(135deg,var(--accent),var(--grad2)); box-shadow:0 0 6px rgba(124,131,255,.6);}
.habit-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-top:14px;}
.weekbars{display:flex; gap:10px; align-items:flex-end; height:120px; margin-top:16px;}
.weekbars .bar{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:7px; height:100%;}
.weekbars .stick{width:100%; max-width:36px; border-radius:9px; background:var(--card2); border:1px solid var(--border); transition:height .4s ease;}
.weekbars .stick.on{background:linear-gradient(180deg,var(--accent),var(--grad2)); border-color:transparent; box-shadow:0 0 16px rgba(124,131,255,.4);}
.weekbars .lbl{font-size:.68rem; color:var(--label);}
.wchart{display:flex; align-items:flex-end; gap:8px; height:140px; margin-top:8px;}
.wchart .col{flex:1; border-radius:9px 9px 4px 4px; min-height:4px;
  background:linear-gradient(180deg,var(--accent),var(--grad2)); box-shadow:0 0 14px rgba(124,131,255,.3); transition:height .5s ease;}
.imgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:13px; margin-top:14px;}
.imgcard{border-radius:15px; overflow:hidden; background:var(--card2); border:1px solid var(--border); cursor:pointer; transition:transform .15s ease, border-color .15s ease;}
.imgcard:hover{transform:translateY(-2px); border-color:var(--border-strong);}
.imgcard img{width:100%; aspect-ratio:1; object-fit:cover; display:block;}
.imgcard .cap{padding:9px 11px; font-size:.78rem; color:var(--muted);}
.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; margin-top:16px;}
.badge{display:flex; flex-direction:column; align-items:center; gap:7px; padding:18px 10px;
  border-radius:16px; background:var(--card); border:1px solid var(--border); text-align:center;}
.badge.locked{opacity:.35; filter:grayscale(1);}
.badge .em{font-size:1.9rem; filter:drop-shadow(0 0 10px rgba(124,131,255,.5));}
.badge .t{font-size:.75rem; color:var(--muted); font-weight:600;}


/* ---------- Locked In ---------- */
.locked-card{background:linear-gradient(135deg,var(--card),rgba(124,131,255,.07)); border-color:rgba(124,131,255,.22);}
.lock-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:18px;}
.lock-day{min-width:0;min-height:92px;padding:10px 6px;border-radius:15px;border:1px solid var(--border);background:var(--card2);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:all .18s ease;}
.lock-day:hover{border-color:var(--border-strong);transform:translateY(-1px);}
.lock-day.locked{background:linear-gradient(145deg,var(--accent-dim),rgba(79,209,255,.10));border-color:rgba(124,131,255,.5);color:var(--text);box-shadow:0 0 18px rgba(124,131,255,.16);}
.lock-check{font-size:1.45rem;font-weight:800;line-height:1;color:var(--label);}
.lock-day.locked .lock-check{color:var(--good);}
.lock-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
.lock-date{font-family:var(--font-display);font-size:1rem;font-weight:800;color:var(--text);}
.locked-hint{margin-top:11px;color:var(--label);font-size:.72rem;text-align:center;}
@media(max-width:600px){.lock-week{gap:5px}.lock-day{min-height:82px;padding:8px 3px}.lock-label{font-size:.6rem}.lock-date{font-size:.9rem}}

/* ---------- Timeline ---------- */
.timeline{position:relative; margin-top:18px; padding-left:28px;}
.timeline::before{content:''; position:absolute; left:8px; top:4px; bottom:4px; width:2px; background:var(--border-strong);}
.tl-year{font-family:var(--font-display); font-size:1.15rem; font-weight:800; color:var(--accent); margin:24px 0 8px;}
.tl-year:first-child{margin-top:0;}
.tl-item{position:relative; padding:9px 0; color:var(--muted);}
.tl-item::before{content:''; position:absolute; left:-24px; top:16px; width:9px; height:9px; border-radius:50%;
  background:var(--accent); box-shadow:0 0 0 3px var(--bg);}
.tl-item .tl-date{font-size:.7rem; color:var(--label); text-transform:uppercase; letter-spacing:.08em;}

/* ---------- FAB, toast, lightbox ---------- */
.fab{
  position:fixed; right:24px; bottom:24px; width:58px; height:58px; border-radius:50%; border:none;
  font-size:1.6rem; cursor:pointer; z-index:60; color:#fff;
  background:linear-gradient(120deg,var(--accent),var(--accent2));
  box-shadow:0 8px 26px rgba(124,131,255,.5);
  display:flex; align-items:center; justify-content:center;
  transition:transform .2s ease;
}
.fab:hover{transform:scale(1.06) rotate(90deg);}
@media(min-width:861px){ .fab{bottom:28px; right:28px;} }
@media(max-width:860px){ .fab{right:18px; bottom:calc(84px + env(safe-area-inset-bottom,0px));} }
.fab-menu{position:fixed; right:24px; bottom:96px; display:none; flex-direction:column; gap:7px; z-index:60;}
.fab-menu.open{display:flex; animation:fadeUp .2s ease;}
.fab-menu button{
  padding:12px 18px; border-radius:14px; border:1px solid var(--border-strong);
  background:var(--card2); color:var(--text); cursor:pointer;
  font-size:.86rem; font-weight:500; box-shadow:var(--shadow); text-align:left; white-space:nowrap;
  transition:border-color .15s ease;
}
.fab-menu button:hover{border-color:var(--accent);}
@media(min-width:861px){ .fab-menu{bottom:100px; right:28px;} }
@media(max-width:860px){ .fab-menu{right:18px; bottom:calc(152px + env(safe-area-inset-bottom,0px));} }
#toast-wrap{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:200; align-items:center; pointer-events:none;}
@media(max-width:860px){ #toast-wrap{bottom:calc(160px + env(safe-area-inset-bottom,0px));} }
.toast{
  padding:12px 20px; border-radius:13px; background:var(--card2); border:1px solid var(--border-strong);
  color:var(--text); box-shadow:var(--shadow); font-size:.88rem; font-weight:500;
  animation:fadeUp .25s ease; white-space:nowrap;
}
#lightbox{position:fixed; inset:0; background:rgba(4,4,9,.93); display:none; align-items:center; justify-content:center; z-index:300; backdrop-filter:blur(6px);}
#lightbox.open{display:flex;}
#lightbox img{max-width:92vw; max-height:86vh; border-radius:16px; box-shadow:var(--shadow);}
#lightbox .close{position:fixed; top:18px; right:22px; background:var(--card2); border:1px solid var(--border-strong); color:var(--text); width:44px; height:44px; border-radius:50%; font-size:1.1rem; cursor:pointer;}

/* ---------- Rest chip ---------- */
#rest-chip{position:fixed; left:16px; bottom:88px; z-index:70; background:var(--card2); border:1px solid var(--border-strong);
  border-radius:18px; padding:12px 16px; box-shadow:var(--shadow); display:none;}
#rest-chip.show{display:block;}
#rest-chip .row{flex-wrap:nowrap;}
@media(min-width:861px){ #rest-chip{left:26px; bottom:26px;} }
@media(max-width:860px){ #rest-chip{left:14px; bottom:calc(84px + env(safe-area-inset-bottom,0px));} }

@media(prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important;}
  html{scroll-behavior:auto;}
}
</style>

<body>
<div id="app">
  <nav id="sidebar">
    <div class="brand"><span class="dot"></span>FORWARD</div>
    <div id="navlinks"></div>
    <div class="bottom">
      <button class="navlink" data-view="settings">⚙️ Inställningar</button>
    </div>
  </nav>

  <main>
    <div class="view active" id="view-dashboard"></div>
    <div class="view" id="view-coach"></div>
    <div class="view" id="view-journey"></div>
    <div class="view" id="view-training"></div>
    <div class="view" id="view-goals"></div>
    <div class="view" id="view-habits"></div>
    <div class="view" id="view-program"></div>
    <div class="view" id="view-body"></div>
    <div class="view" id="view-dreams"></div>
    <div class="view" id="view-journal"></div>
    <div class="view" id="view-gallery"></div>
    <div class="view" id="view-stats"></div>
    <div class="view" id="view-settings"></div>
    <div id="toast-wrap"></div>
  </main>

<script>
const NAV=[
  {id:'dashboard',label:'Dashboard',icon:'M3 12l9-9 9 9M5 10v10h14V10'},
  {id:'coach',label:'AI Coach',icon:'M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z'},
  {id:'journey',label:'Min resa',icon:'M3 12h4l3-9 4 18 3-9h4'},
  {id:'training',label:'Träning',icon:'M6 6l12 12M18 6L6 18'},
  {id:'goals',label:'Mål',icon:'M12 2v20M2 12h20'},
  {id:'habits',label:'Habits',icon:'M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11'},
  {id:'program',label:'Program',icon:'M4 6h16M4 12h16M4 18h10'},
  {id:'body',label:'Kropp',icon:'M12 3v18M5 8l7-5 7 5'},
  {id:'dreams',label:'Drömmar',icon:'M12 21s-8-5-8-11a8 8 0 0116 0c0 6-8 11-8 11z'},
  {id:'journal',label:'Journal',icon:'M4 4h16v16H4z'},

];
function icon(d){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;}
document.getElementById('navlinks').innerHTML = NAV.map(n=>`<button class="navlink" data-view="${n.id}">${icon(n.icon)}${n.label}</button>`).join('');
document.getElementById('bottomnav').innerHTML = NAV.map(n=>`<button class="navlink" data-view="${n.id}">${icon(n.icon)}${n.label}</button>`).join('') + `<button class="navlink" data-view="settings">${icon('M12 15a3 3 0 100-6 3 3 0 000 6z')}Inst.</button>`;

// ---------- Data ----------
const DB_KEY='forward_app_data_v1';
function loadDB(){
  try{ const d=JSON.parse(localStorage.getItem(DB_KEY)) || {}; return {workouts:[],trainingDays:[],goals:[],dreams:[],journal:[],photos:[],records:[],habits:[],body:[],programs:[],theme:'dark',...d}; }
  catch(e){ return {workouts:[],trainingDays:[],goals:[],dreams:[],journal:[],photos:[],records:[],habits:[],body:[],programs:[],theme:'dark'}; }
}
let db = loadDB();
let saveTimer=null;
function save(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    localStorage.setItem(DB_KEY+'_saved_at', new Date().toISOString());
  }catch(e){
    console.error('Storage error',e);
    toast('Kunde inte spara automatiskt — lagringsutrymmet kan vara fullt.');
  }
}
function autoSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,120); }
window.addEventListener('beforeunload',save);
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') save(); });
setInterval(save,30000);
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtDate(d){ return new Date(d).toLocaleDateString('sv-SE',{day:'numeric',month:'long',year:'numeric'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function quickAdd(view,panel){ setView(view); togglePanel(panel); }
function readImageCompressed(file, cb){
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=1200; let w=img.width,h=img.height;
      if(w>MAX||h>MAX){ const k=MAX/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=()=>cb(r.result);
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

// ---------- Nav ----------
function setView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  document.querySelectorAll('.navlink').forEach(b=>b.classList.toggle('active', b.dataset.view===id));
  renderAll();
  window.scrollTo(0,0);
}
document.querySelectorAll('.navlink').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));

// ---------- Dashboard ----------
function renderDashboard(){
  const h=new Date().getHours();
  const greet = h<5?'Du är uppe sent':h<12?'God morgon':h<18?'God eftermiddag':'God kväll';
  const totalVol = w => (w.exercises||[]).reduce((s,e)=>s+(e.sets*e.reps*e.weight||0),0);
  const streak = calcStreak();
  const last = [...db.workouts].sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  const activeGoals = db.goals.filter(g=>g.status!=='Completed');
  const recentPhotos = [...db.photos].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4);
  const recentPR = [...db.records].sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  const isFirstRun = !db.workouts.length && !db.goals.length && !db.habits.length && !db.journal.length && !db.photos.length && !db.records.length && !db.dreams.length && !localStorage.getItem('forward_seen_v1');
  if(isFirstRun) localStorage.setItem('forward_seen_v1','1');

  // 7-day activity
  const days=[]; const dayLbl=['S','M','T','O','T','F','L'];
  let onCount=0;
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const key=todayStr(d);
     const has = (db.trainingDays||[]).includes(key) || db.workouts.some(w=>new Date(w.date).toDateString()===d.toDateString());
    if(has) onCount++;
    days.push({lbl:dayLbl[d.getDay()], on:has});
  }
  const consistency = Math.round((onCount/7)*100);
  const R=42, C=2*Math.PI*R, offset=C-(consistency/100)*C;

  document.getElementById('view-dashboard').innerHTML = `
    <div class="date">${fmtDate(new Date())}</div>
    <h1 style="font-size:2.1rem;">${greet}<span style="color:var(--accent);">.</span></h1>
    <div class="sub">Bygg personen du vill bli, en dag i taget.</div>
    ${isFirstRun? `
    <div class="card" style="margin-top:18px; border-color:rgba(124,131,255,.35);">
      <h3>Välkommen till FORWARD</h3>
      <div class="sub" style="margin-bottom:14px;">Börja med ett av dessa, allt sparas bara i din webbläsare:</div>
      <div class="row">
        <button class="btn" onclick="quickAdd('training','w-panel')">Logga ditt första pass</button>
        <button class="btn ghost" onclick="quickAdd('goals','g-panel')">Sätt ett mål</button>
        <button class="btn ghost" onclick="quickAdd('habits','h-panel')">Skapa en habit</button>
      </div>
    </div>`:''}

    <div class="grid" style="grid-template-columns:1.3fr 1fr; margin-top:24px;">
      <div class="card hero-card">
        <h3>Veckans aktivitet</h3>
        <div class="weekbars">${days.map(d=>`<div class="bar"><div class="stick ${d.on?'on':''}" style="height:${d.on?'100%':'14%'}"></div><div class="lbl">${d.lbl}</div></div>`).join('')}</div>
        <div class="rowbetween" style="margin-top:18px;">
          <div><div class="big" style="font-size:1.6rem;">${streak} <span style="font-size:.9rem;color:var(--text3);">dagars streak 🔥</span></div>
          <div class="label" style="margin-top:2px;">${last? `Senast: ${esc(last.title)}, ${fmtDate(last.date)}`:'Inget pass loggat än'}</div></div>
        </div>
      </div>
      <div class="card" style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
        <svg width="110" height="110" class="ring"><circle cx="55" cy="55" r="${R}" stroke="var(--card2)" stroke-width="9"/><circle cx="55" cy="55" r="${R}" stroke="var(--accent)" stroke-width="9" stroke-dasharray="${C}" stroke-dashoffset="${offset}"/></svg>
        <div class="big" style="margin-top:-72px;">${consistency}%</div>
        <div class="label" style="margin-top:66px;">Konsistens denna vecka</div>
      </div>
    </div>

    <div class="card locked-card">
      <div class="rowbetween">
        <div><h3 style="margin-bottom:4px;">LOCKED IN</h3><div class="sub">Kryssa bara i dagen när du har tränat. Enkelt, snabbt och sparas automatiskt.</div></div>
        <span class="pr-badge">${onCount}/7 denna vecka</span>
      </div>
      <div class="lock-week">
        ${days.map((d,i)=>{ const dt=new Date(); dt.setDate(dt.getDate()-(6-i)); const key=todayStr(dt); const checked=(db.trainingDays||[]).includes(key) || db.workouts.some(w=>new Date(w.date).toDateString()===dt.toDateString()); return `<button type="button" class="lock-day ${checked?'locked':''}" onclick="toggleTrainingDay('${key}')" aria-label="${fmtDate(dt)} ${checked?'tränad':'inte tränad'}"><span class="lock-check">${checked?'✓':'○'}</span><span class="lock-label">${d.lbl}</span><span class="lock-date">${dt.getDate()}</span></button>`; }).join('')}
      </div>
      <div class="locked-hint">✓ = locked in · Klicka igen för att ta bort.</div>
    </div>

    <div class="grid" style="margin-top:16px;">
      <div class="card"><div class="icobox">${icon('M6 6l12 12M18 6L6 18')}</div><h3>Aktiva mål</h3><div class="big">${activeGoals.length}</div></div>
      <div class="card"><div class="icobox">${icon('M4 4h16v16H4z')}</div><h3>Journal</h3><div class="big">${db.journal.length}</div></div>
      <div class="card"><div class="icobox">${icon('M12 2v20M2 12h20')}</div><h3>Volym senaste pass</h3><div class="big">${last?totalVol(last).toLocaleString('sv-SE'):0}<span style="font-size:.9rem;color:var(--text3);"> kg</span></div></div>
      <div class="card"><div class="icobox">${icon('M12 21s-8-5-8-11a8 8 0 0116 0c0 6-8 11-8 11z')}</div><h3>Drömmar</h3><div class="big">${db.dreams.length}</div></div>
    </div>

    <div class="grid" style="margin-top:16px;">
      <div class="card" style="grid-column:span 2;">
        <div class="rowbetween"><h3 style="margin-bottom:12px;">Mål i fokus</h3>${recentPR?`<span class="pr-badge">🏆 Nytt PR: ${esc(recentPR.name)} ${esc(recentPR.value)}</span>`:''}</div>
        ${activeGoals.slice(0,3).map(g=>`<div style="margin-bottom:12px;"><div class="rowbetween"><span>${esc(g.title)}</span><span class="label">${g.progress}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${g.progress}%"></div></div></div>`).join('') || `<div class="label">Inga mål ännu.</div>`}
      </div>
      <div class="card" style="grid-column:span 2;">
        <h3>Senaste bilder</h3>
        ${recentPhotos.length? `<div class="imgrid">${recentPhotos.map(p=>`<div class="imgcard" onclick="openLightbox('${p.id}')"><img src="${p.image}"></div>`).join('')}</div>` : `<div class="label">Inga bilder uppladdade än.</div>`}
      </div>
    </div>
  `;
}
function calcStreak(){
  const days = new Set([...(db.trainingDays||[]), ...db.workouts.map(w=>todayStr(new Date(w.date)))]);
  let streak=0, d=new Date();
  while(days.has(todayStr(d))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

function toggleTrainingDay(key){
  db.trainingDays=db.trainingDays||[];
  const i=db.trainingDays.indexOf(key);
  if(i>=0){ db.trainingDays.splice(i,1); toast('Dagen avmarkerad'); }
  else { db.trainingDays.push(key); toast('LOCKED IN 🔒'); }
  save(); renderDashboard();
}

// ---------- Training ----------
let exBuffer=[];
function renderTraining(){
  document.getElementById('view-training').innerHTML=`
    <div class="rowbetween"><div><h1>Träning</h1><div class="sub">Logga dina pass och följ din utveckling.</div></div>
    <button class="btn" onclick="togglePanel('w-panel')">+ Nytt pass</button></div>
    <form class="panel" id="w-panel" onsubmit="return addWorkout(event)">
      <div class="fieldrow">
        <div class="field"><label>Namn</label><input id="w-title" required placeholder="t.ex. Push, Legs, Football"></div>
        <div class="field"><label>Datum</label><input id="w-date" type="date" required value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <div class="field"><label>Varaktighet (min)</label><input id="w-dur" type="number" min="0"></div>
      <div class="field"><label>Anteckning</label><textarea id="w-notes" placeholder="Hur kändes passet?"></textarea></div>
      <div id="ex-list"></div>
      <div class="row"><input id="ex-name" placeholder="Övning" style="flex:2;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;">
        <input id="ex-sets" type="number" placeholder="Set" style="width:70px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;">
        <input id="ex-reps" type="number" placeholder="Reps" style="width:70px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;">
        <input id="ex-weight" type="number" placeholder="Kg" style="width:70px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;">
        <button type="button" class="btn ghost" onclick="addExRow()">Lägg till övning</button></div>
      <div class="row"><button class="btn" type="submit">Spara pass</button><button type="button" class="btn ghost" onclick="togglePanel('w-panel')">Avbryt</button></div>
    </form>
    <div id="w-list"></div>
  `;
  renderExBuffer();
  const list=document.getElementById('w-list');
  const items=[...db.workouts].sort((a,b)=>new Date(b.date)-new Date(a.date));
  list.innerHTML = items.length? items.map(w=>{
    const vol=(w.exercises||[]).reduce((s,e)=>s+(e.sets*e.reps*e.weight||0),0);
    return `<div class="list-item"><div class="rowbetween"><div><div class="title">${esc(w.title)}</div><div class="meta">${fmtDate(w.date)} · ${w.duration||'–'} min · Volym ${vol.toLocaleString('sv-SE')} kg</div></div>
      <button class="btn ghost" onclick="deleteItem('workouts','${w.id}')">Ta bort</button></div>
      ${(w.exercises||[]).length? `<div style="margin-top:8px;">${w.exercises.map(e=>`<span class="tag">${esc(e.name)}: ${e.sets}×${e.reps} @ ${e.weight}kg</span>`).join('')}</div>`:''}
      ${w.notes?`<div class="meta" style="margin-top:6px;">${esc(w.notes)}</div>`:''}
      </div>`;
  }).join('') : `<div class="empty">Inga träningspass ännu.<br><button class="btn" onclick="togglePanel('w-panel')">+ Lägg till ditt första pass</button></div>`;

  document.getElementById('view-training').insertAdjacentHTML('beforeend', `
    <div class="rowbetween" style="margin-top:34px;"><h2 style="margin-bottom:0;">Personliga rekord</h2>
    <button class="btn ghost" onclick="togglePanel('r-panel')">+ Nytt rekord</button></div>
    <form class="panel" id="r-panel" onsubmit="return addRecord(event)" style="margin-top:14px;">
      <div class="fieldrow">
        <div class="field"><label>Övning / disciplin</label><input id="r-name" required placeholder="t.ex. Bench Press, 5km"></div>
        <div class="field"><label>Resultat</label><input id="r-value" required placeholder="t.ex. 100 kg, 23:14"></div>
      </div>
      <div class="row"><button class="btn" type="submit">Spara rekord</button><button type="button" class="btn ghost" onclick="togglePanel('r-panel')">Avbryt</button></div>
    </form>
    <div class="imgrid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr));">
      ${db.records.length? db.records.map(r=>`
        <div class="card" style="padding:16px;">
          <div class="rowbetween"><h3 style="margin:0;">${esc(r.name)}</h3><a href="#" onclick="deleteItem('records','${r.id}');return false;" style="color:var(--text3);font-size:.8rem;">✕</a></div>
          <div class="big" style="font-size:1.5rem;margin-top:4px;">${esc(r.value)}</div>
          <div class="label">${fmtDate(r.date)}</div>
        </div>`).join('') : `<div class="empty" style="grid-column:1/-1;">Inga rekord loggade ännu.</div>`}
    </div>
  `);
}
function addRecord(ev){
  ev.preventDefault();
  db.records.push({id:uid(), name:document.getElementById('r-name').value, value:document.getElementById('r-value').value, date:new Date().toISOString()});
  save(); togglePanel('r-panel'); renderTraining(); renderDashboard(); toast('Rekord sparat 🏆');
  return false;
}
function addExRow(){
  const name=document.getElementById('ex-name').value.trim();
  const sets=+document.getElementById('ex-sets').value, reps=+document.getElementById('ex-reps').value, weight=+document.getElementById('ex-weight').value;
  if(!name) return;
  exBuffer.push({name,sets:sets||0,reps:reps||0,weight:weight||0});
  ['ex-name','ex-sets','ex-reps','ex-weight'].forEach(id=>document.getElementById(id).value='');
  renderExBuffer();
}
function renderExBuffer(){
  document.getElementById('ex-list').innerHTML = exBuffer.map((e,i)=>`<span class="tag">${esc(e.name)}: ${e.sets}×${e.reps} @ ${e.weight}kg <a href="#" onclick="exBuffer.splice(${i},1);renderExBuffer();return false;" style="color:var(--danger);">✕</a></span>`).join(' ');
}
function addWorkout(ev){
  ev.preventDefault();
  db.workouts.push({id:uid(), title:document.getElementById('w-title').value, date:document.getElementById('w-date').value,
    duration:+document.getElementById('w-dur').value||null, notes:document.getElementById('w-notes').value, exercises:exBuffer});
  exBuffer=[]; save(); togglePanel('w-panel'); renderTraining(); renderDashboard(); toast('Träningspass sparat ✓');
  return false;
}

// ---------- Goals ----------
function renderGoals(){
  document.getElementById('view-goals').innerHTML=`
    <div class="rowbetween"><div><h1>Mål</h1><div class="sub">Det du bygger mot.</div></div>
    <button class="btn" onclick="togglePanel('g-panel')">+ Nytt mål</button></div>

        <div class="field"><label>Kategori</label><select id="g-cat"><option>Fitness</option><option>Football</option><option>Education</option><option>Finance</option><option>Personal</option></select></div>

      </div>
      <div class="field"><label>Beskrivning</label><textarea id="g-desc"></textarea></div>
      <div class="row"><button class="btn" type="submit">Spara mål</button><button type="button" class="btn ghost" onclick="togglePanel('g-panel')">Avbryt</button></div>
    </form>
    <div id="g-list"></div>
  `;
  const list=document.getElementById('g-list');
  list.innerHTML = db.goals.length? db.goals.map(g=>`
    <div class="list-item">
      <div class="rowbetween"><div><span class="tag">${esc(g.category)}</span><span class="title">${esc(g.title)}</span></div>
      <button class="btn ghost" onclick="deleteItem('goals','${g.id}')">Ta bort</button></div>
      ${g.desc?`<div class="meta" style="margin:6px 0;">${esc(g.desc)}</div>`:''}
      <div class="rowbetween" style="margin-top:8px;"><span class="label">${g.progress}% · ${g.status}${g.deadline?' · deadline '+fmtDate(g.deadline):''}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${g.progress}%"></div></div>
      <div class="row" style="margin-top:10px;"><input type="range" min="0" max="100" value="${g.progress}" onchange="updateGoalProgress('${g.id}',this.value)" style="flex:1;"></div>
    </div>`).join('') : `<div class="empty">Inga mål ännu.<br><button class="btn" onclick="togglePanel('g-panel')">+ Lägg till ditt första mål</button></div>`;
}
function addGoal(ev){
  ev.preventDefault();
  db.goals.push({id:uid(), title:document.getElementById('g-title').value, category:document.getElementById('g-cat').value,
    deadline:document.getElementById('g-deadline').value, desc:document.getElementById('g-desc').value, progress:0, status:'In progress', createdAt:new Date().toISOString()});
  save(); togglePanel('g-panel'); renderGoals(); renderDashboard(); toast('Mål sparat ✓');
  return false;
}
function updateGoalProgress(id,val){
  const g=db.goals.find(x=>x.id===id); g.progress=+val;
  const wasCompleted = g.status==='Completed';
  g.status = val>=100?'Completed':'In progress';
  if(g.status==='Completed' && !wasCompleted){ g.completedAt=new Date().toISOString(); toast('Mål slutfört 🎉'); }
  save(); renderGoals();
}

// ---------- Dreams ----------
function renderDreams(){
  document.getElementById('view-dreams').innerHTML=`
    <div class="rowbetween"><div><h1>Drömmar</h1><div class="sub">Din vision board.</div></div>
    <button class="btn" onclick="togglePanel('d-panel')">+ Ny dröm</button></div>
    <form class="panel" id="d-panel" onsubmit="return addDream(event)">
      <div class="field"><label>Titel</label><input id="d-title" required placeholder="t.ex. Drömhus"></div>
      <div class="field"><label>Bild</label><input id="d-image" type="file" accept="image/*"></div>
      <div class="field"><label>Varför vill jag uppnå den?</label><textarea id="d-why"></textarea></div>
      <div class="row"><button class="btn" type="submit">Spara dröm</button><button type="button" class="btn ghost" onclick="togglePanel('d-panel')">Avbryt</button></div>
    </form>
    <div id="d-grid" class="imgrid"></div>

function importData(ev){
  const file=ev.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(typeof d!=='object'||d===null||!Array.isArray(d.workouts)) throw new Error('bad');
      if(!confirm('Importera och skriv \u00f6ver all lokal data i den h\u00e4r webbl\u00e4saren?')){ ev.target.value=''; return; }
      db={workouts:[],goals:[],dreams:[],journal:[],photos:[],records:[],habits:[],body:[],programs:[],theme:'dark',...d};
      document.documentElement.dataset.theme = db.theme==='light'?'light':'dark';
      save(); renderAll(); toast('Data importerad \u2713');
    }catch(e){ toast('Ogiltig fil \u2014 anv\u00e4nd en JSON som exporterats fr\u00e5n FORWARD.'); }
    ev.target.value='';
  };
  r.readAsText(file);
}

  while(days.has(todayStr(d))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

const AI_PROVIDERS={
  groq:{name:'Groq (gratis)',url:'https://api.groq.com/openai/v1/chat/completions',model:'llama-3.3-70b-versatile'},
  openrouter:{name:'OpenRouter (gratis-modeller)',url:'https://openrouter.ai/api/v1/chat/completions',model:'meta-llama/llama-3.3-70b-instruct:free'},

const AI_CFG_KEY='forward_ai_cfg_v1';
let coachTurns=[];
function getAICfg(){
  try{ return {provider:'groq',key:'',model:'',...(JSON.parse(localStorage.getItem(AI_CFG_KEY))||{})}; }

function hasRealAI(){ const c=getAICfg(); return !!c.key || !!(window.claude&&window.claude.use); }
function localCoachAnswer(q){
  const t=(q||'').toLowerCase();
  const wks=[...db.workouts].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const now=new Date();
  const inLast=n=>wks.filter(w=>{const d=(now-new Date(w.date))/864e5; return d>=0&&d<n;});
  const vol=w=>(w.exercises||[]).reduce((s,e)=>s+(e.sets*e.reps*e.weight||0),0);
  const avg=arr=>arr.length?Math.round(arr.reduce((s,w)=>s+vol(w),0)/arr.length):0;
  const volThisWeek=avg(inLast(7)), volPrevWeek=avg(inLast(14).filter(w=>(now-new Date(w.date))/864e5>=7));
  const trend=volPrevWeek? Math.round((volThisWeek-volPrevWeek)/volPrevWeek*100) : null;
  const exCount={};
  wks.forEach(w=>(w.exercises||[]).forEach(e=>exCount[e.name]=(exCount[e.name]||0)+1));
  const topEx=Object.entries(exCount).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const streak=calcStreak();
  const goals=db.goals, active=goals.filter(g=>g.status!=='Completed');
  const habits=db.habits;
  const mentions=(...ws)=>ws.some(x=>t.includes(x));
  let out='';
  if(mentions('streak','konsekvent','konsekvens','varje dag','vane')){
    out='Din streak är '+streak+' dagar. ';
    out+= wks.length? ('Totalt '+wks.length+' pass loggade, '+inLast(7).length+' den senaste veckan.') : 'Du har inte loggat något pass än, börja med ett kort idag så får du igång den.';
    if(habits.length){ const hs=habits.map(h=>h.name+': '+calcHabitStreak(h)+' dagar').join(', '); out+=' Habits: '+hs+'.'; }
  } else if(mentions('volym','styrka','progress','tungt','utveckl')){
    out='Senaste veckans snittvolym är '+volThisWeek.toLocaleString('sv-SE')+' kg per pass';
    out+= trend===null? ' (ingen förra vecka att jämföra med än).' : (', det är '+(trend>=0?'+':'')+trend+'% mot veckan innan. ');
    if(topEx.length) out+='Mest tränat: '+topEx.map(p=>p[0]+' ('+p[1]+'g)').join(', ')+'.';
    if(db.records.length){ const r=db.records[db.records.length-1]; out+=' Senaste PR: '+r.name+' '+r.value+'.'; }
  } else if(mentions('mål','deadline')){
    if(!goals.length) out='Du har inga mål upplagga än. Lägg till ett under Mål så kan jag följa det.';
    else { out=active.length+' aktiva mål av '+goals.length+'. '; out+=active.slice(0,3).map(g=>g.title+' ligger på '+g.progress+'%').join(', ')+'.'; }
  } else if(mentions('pass','träna','träning','gym','övn')){
    out= wks.length? (wks.length+' pass loggade, '+inLast(7).length+' senaste veckan. Senast: '+wks[0].title+' ('+fmtDate(wks[0].date)+')'+(wks[0].notes?', dina anteckningar: ”'+wks[0].notes+'”':'')+'.')
      : 'Inga pass loggade än. Klicka på + Nytt pass under Träning så börjar grafen leva.';
  } else if(mentions('journal','känsla','mood','humör')){
    out= db.journal.length? (db.journal.length+' anteckningar. Senaste: ”'+(db.journal[db.journal.length-1].title||'')+'” ('+(db.journal[db.journal.length-1].mood||'')+').')
      : 'Inga journalanteckningar än. Att skriva av sig efter pass brukar hjälpa en se vad som faktiskt funkar.';
  } else {
    out='Jag kan hjälpa dig med den typen av fråga när en riktig AI-leverantör är ansluten. Just nu har appen ingen AI-anslutning aktiv, så jag vill inte låtsas kunna svara på allmänna frågor med en begränsad lokal analys. Gå till Inställningar → AI och anslut en API-nyckel.';
  }
  return out;
}
async function callProviderAPI(messages){
  const cfg=getAICfg();
  if(!cfg.key) throw {code:'no_key'};
  const p=AI_PROVIDERS[cfg.provider]||AI_PROVIDERS.groq;
  const headers={'Content-Type':'application/json','Authorization':'Bearer '+cfg.key};
  if(cfg.provider==='openrouter'){ headers['HTTP-Referer']='https://forward.local'; headers['X-Title']='FORWARD'; }
  const res=await fetch(p.url,{method:'POST',headers,body:JSON.stringify({model:cfg.model||p.model,messages,temperature:0.7,max_tokens:600})});
  if(!res.ok){
    let msg='HTTP '+res.status;
    try{ const j=await res.json(); msg=j.error&&j.error.message?j.error.message:msg; }catch(e){}
    throw {code:'api', text:msg};
  }
  const j=await res.json();
  return (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
}
async function getCoachReply(messages){
  if(window.claude&&window.claude.use){
    try{
      const sampleFn=await window.claude.use('sample');
      if(sampleFn){ const r=await sampleFn(messages,{modelTier:'default',cache:false}); return {text:r.text}; }
    }catch(e){}
  }
  const cfg=getAICfg();
  if(cfg.key){
    try{ return {text:await callProviderAPI(messages)}; }
    catch(e){ return {text:null,err:e}; }
  }
  const last=[...messages].reverse().find(x=>x.role==='user');
  return {text:localCoachAnswer(last?last.content:''),badge:'local'};
}
function renderCoachShell(){
  document.getElementById('view-coach').innerHTML = `
    <h1>AI Coach</h1><div class="sub">Fråga vad du vill. Om allt.</div>
    <div id="coach-note" class="label" style="margin:12px 0;"></div>
    <div id="coach-msgs" style="display:flex;flex-direction:column;gap:10px;margin:16px 0;max-width:640px;"></div>
    <div class="row" style="max-width:640px;">
      <input id="coach-input" placeholder="Fråga vad som helst..." style="flex:1;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;">
      <button class="btn" id="coach-send" onclick="askCoach()">Fråga</button>
      <button class="btn ghost" onclick="askFo()">Fråga Fo</button>
    </div>
  `;
  document.getElementById('coach-input').addEventListener('keydown', e=>{ if(e.key==='Enter') askCoach(); });
  initSample();
}
function coachMsg(role, text){
  const wrap=document.getElementById('coach-msgs');
  const div=document.createElement('div');
  div.style.cssText = role==='user'
    ? 'align-self:flex-end;background:var(--accent-dim);padding:10px 14px;border-radius:14px 14px 2px 14px;max-width:85%;white-space:pre-wrap;'
    : 'align-self:flex-start;background:var(--card2);padding:10px 14px;border-radius:14px 14px 14px 2px;max-width:85%;white-space:pre-wrap;';
  div.textContent=text;
  wrap.appendChild(div); div.scrollIntoView({block:'nearest'});
  return div;
}
async function initSample(){
  const note=document.getElementById('coach-note');
  if(!note) return;
  const cfg=getAICfg();
  if(window.claude&&window.claude.use){ note.textContent='Svarar via claude.ai.'; return; }
  if(cfg.key){ note.textContent='Svarar via '+((AI_PROVIDERS[cfg.provider]||AI_PROVIDERS.groq).name)+'.'; return; }
  note.textContent='AI Coach är redo. För fullständiga svar på alla typer av frågor, anslut en AI-leverantör under Inställningar.';
}
function askFo(){
  const inp=document.getElementById('coach-input');
  const q=(inp&&inp.value.trim()) || 'Hur har min träning och utveckling gått nyligen? Ge mig en status och vad jag bör fokusera på här näst.';
  const pkg = 'Jag loggar min träning i min app FORWARD. Här är min fråga och min loggade data som JSON.\n\nFRÅGA: '+q+'\n\nMIN DATA:\n'+JSON.stringify(buildCoachContext());
  const done=()=>{ window.open('https://wajo.ai/','_blank'); toast('Kopierat! Klistra in i chatten med Fo.'); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(pkg).then(done).catch(()=>{ fallbackCopy(pkg); done(); }); }
  else { fallbackCopy(pkg); done(); }
}
function fallbackCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove();
}
async function askCoach(){
  const inp=document.getElementById('coach-input'); const q=inp.value.trim(); if(!q) return;
  inp.value=''; const sendBtn=document.getElementById('coach-send'); sendBtn.disabled=true;
  coachMsg('user', q);
  const thinking=coachMsg('assistant','Tänker...');
  coachTurns.push({role:'user',content:q});
  const RULES = 'Du är FORWARD AI – en allmän AI-assistent inbyggd i appen FORWARD. Du ska kunna hjälpa användaren med nästan vilken fråga som helst: allmän kunskap, teknik, datorer, telefoner, träning, kost, sömn, studier, matematik, ekonomi, planering, skrivande, idéer, programmering, vardagsfrågor och andra ämnen.\n\nVIKTIGT: Svara på själva frågan även när den inte handlar om träning. Begränsa aldrig svaret till FORWARD-appen bara för att frågan ställs här. Om du inte vet eller saknar aktuell information, säg det tydligt i stället för att hitta på. För frågor som kräver aktuella uppgifter ska du vara tydlig med att du behöver aktuell information. För frågor om användarens egen träning, mål, habits, journal och historik ska du använda datan nedan och anpassa svaret personligt.\n\nSvara normalt och direkt. Ge en tydlig förklaring när det behövs och konkreta steg när användaren frågar hur man gör något. Svara på samma språk som användaren. Använd svenska när användaren skriver svenska.\n\nAnvändarens loggade data i FORWARD (JSON):\n'+JSON.stringify(buildCoachContext());
  const messages=[{role:'system',content:RULES},...coachTurns];
  try{
    const reply=await getCoachReply(messages);
    if(reply.text){ thinking.textContent=reply.text; coachTurns.push({role:'assistant',content:reply.text}); }
    else {
      const map={no_key:'Ingen API-nyckel sparad — lägg till en gratis nyckel under Inställningar.', api:'API:t svarade med fel', rate_limited:'För många frågor just nu — försök igen om en stund.', refused:'Kunde inte svara på det. Prova att omformulera frågan.', session_expired:'Du behöver logga in igen på claude.ai.'};
      let msg = reply.err ? ((map[reply.err.code]||reply.err.text||map.api)+(reply.err.code==='api'?': '+reply.err.text:'')) : 'Något gick fel. Försök igen.';
      thinking.textContent=msg+'\n\n(Lokal analys: '+localCoachAnswer(q)+')';
      coachTurns.pop();
    }
  }catch(e){
    thinking.textContent='Något gick fel. Försök igen.';
    coachTurns.pop();
  } finally {
    sendBtn.disabled=false;
  }
}


// ---------- Program ----------
let progEx=[];
function renderProgram(){
  document.getElementById('view-program').innerHTML=`
    <div class="rowbetween"><div><h1>Program</h1><div class="sub">Spara dina träningsprogram och starta ett pass med ett klick.</div></div>
    <button class="btn" onclick="togglePanel('pg-panel')">+ Nytt program</button></div>
    <form class="panel" id="pg-panel" onsubmit="return saveProgram(event)">
      <div class="field"><label>Namn</label><input id="pg-name" required placeholder="t.ex. Push A, Ben-tung"></div>
      <div class="row">
        <input id="pg-ex-name" placeholder="Övning" style="flex:2;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;">
        <input id="pg-ex-sets" type="number" placeholder="Set" style="width:70px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;">
        <input id="pg-ex-reps" type="number" placeholder="Reps" style="width:70px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;">
        <input id="pg-ex-weight" type="number" placeholder="Kg" style="width:70px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;">
        <button type="button" class="btn ghost" onclick="addProgEx()">Lägg till övning</button>
      </div>
      <div id="pg-ex-list" style="margin-top:10px;"></div>
      <div class="row" style="margin-top:12px;"><button class="btn" type="submit">Spara program</button><button type="button" class="btn ghost" onclick="togglePanel('pg-panel')">Avbryt</button></div>
    </form>
    <div id="pg-list"></div>`;
  renderProgEx();
  const list=document.getElementById('pg-list');
  list.innerHTML = db.programs.length? db.programs.map(p=>`
    <div class="list-item">
      <div class="rowbetween"><div class="title">${esc(p.name)}</div>
      <div class="row">
        <button class="btn" onclick="startProgram('${p.id}')">▶ Starta pass</button>
        <button class="btn ghost" onclick="deleteItem('programs','${p.id}')">Ta bort</button>
      </div></div>
      ${(p.exercises||[]).length? `<div style="margin-top:8px;">${p.exercises.map(e=>`<span class="tag">${esc(e.name)}: ${e.sets}×${e.reps} @ ${e.weight}kg</span>`).join('')}</div>`:''}
    </div>`).join('') : `<div class="empty">Inga program ännu.<br><button class="btn" onclick="togglePanel('pg-panel')">+ Skapa ditt första program</button></div>`;
}
function addProgEx(){
  const name=document.getElementById('pg-ex-name').value.trim();
  if(!name) return;
  progEx.push({name,sets:+document.getElementById('pg-ex-sets').value||0,reps:+document.getElementById('pg-ex-reps').value||0,weight:+document.getElementById('pg-ex-weight').value||0});
  ['pg-ex-name','pg-ex-sets','pg-ex-reps','pg-ex-weight'].forEach(id=>document.getElementById(id).value='');
  renderProgEx();
}
function renderProgEx(){
  const el=document.getElementById('pg-ex-list'); if(!el) return;
  el.innerHTML = progEx.map((e,i)=>`<span class="tag">${esc(e.name)}: ${e.sets}×${e.reps} @ ${e.weight}kg <a href="#" onclick="progEx.splice(${i},1);renderProgEx();return false;" style="color:var(--danger);">✕</a></span>`).join(' ');
}
function saveProgram(ev){
  ev.preventDefault();
  db.programs.push({id:uid(),name:document.getElementById('pg-name').value,exercises:progEx,createdAt:new Date().toISOString()});
  progEx=[]; save(); togglePanel('pg-panel'); renderProgram(); toast('Program sparat ✓');
  return false;
}
function startProgram(id){
  const p=db.programs.find(x=>x.id===id); if(!p) return;
  exBuffer=(p.exercises||[]).map(e=>({...e}));
  setView('training');
  setTimeout(()=>{
    const panel=document.getElementById('w-panel'); if(panel && !panel.classList.contains('open')) panel.classList.add('open');
    const t=document.getElementById('w-title'); if(t) t.value=p.name;
  },40);
  toast('Programmet laddat — spara passet när du är klar ✓');
}

// ---------- Kropp ----------
function renderBody(){
  document.getElementById('view-body').innerHTML=`
    <div class="rowbetween"><div><h1>Kropp</h1><div class="sub">Logga vikten och se trenden över tid.</div></div></div>
    <form class="panel open" onsubmit="return addBodyEntry(event)" style="margin-top:14px;">
      <div class="fieldrow">
        <div class="field"><label>Datum</label><input id="b-date" type="date" required value="${todayStr()}"></div>
        <div class="field"><label>Vikt (kg)</label><input id="b-weight" type="number" step="0.1" min="0" required placeholder="t.ex. 72.4"></div>
      </div>
      <div class="field"><label>Anteckning</label><input id="b-note" placeholder="valfritt"></div>
      <div class="row"><button class="btn" type="submit">Logga vikt</button></div>
    </form>
    <div class="card" id="body-chart"></div>
    <div id="b-list"></div>`;
  const el=document.getElementById('body-chart');
  const pts=[...db.body].sort((a,b)=>a.date<b.date?-1:1);
  if(pts.length<2){ el.innerHTML='<h3>Viktgraf</h3><div class="label" style="margin-top:10px;">Logga minst två vägningar för att se grafen.</div>'; }
  else{
    const W=560,H=150,P=26;
    const ws=pts.map(p=>+p.weight);
    let mn=Math.min(...ws), mx=Math.max(...ws);
    if(mx-mn<1){ mx=mx+0.5; mn=Math.max(0,mn-0.5); }
    const X=i=>P+i*(W-2*P)/(pts.length-1);
    const Y=v=>P+(mx-v)*(H-2*P)/(mx-mn);
    const poly=pts.map((p,i)=>X(i).toFixed(1)+','+Y(+p.weight).toFixed(1)).join(' ');
    el.innerHTML=`<h3>Viktgraf</h3>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:10px;">
        <polyline points="${poly}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(+p.weight).toFixed(1)}" r="3.5" fill="var(--grad2)"/>`).join('')}
      </svg>
      <div class="rowbetween" style="margin-top:8px;"><span class="label">${pts[0].date}: ${pts[0].weight} kg</span><span class="label">${pts[pts.length-1].date}: ${pts[pts.length-1].weight} kg</span></div>`;
  }
  const list=document.getElementById('b-list');
  const items=[...db.body].sort((a,b)=>b.date<a.date?-1:1);
  list.innerHTML = items.length? items.map(e=>`
    <div class="list-item"><div class="rowbetween"><div><span class="title">${e.weight} kg</span> <span class="label">· ${fmtDate(e.date)}</span></div>
    <button class="btn ghost" onclick="deleteItem('body','${e.id}')">Ta bort</button></div>
    ${e.note?`<div class="meta" style="margin-top:4px;">${esc(e.note)}</div>`:''}</div>`).join('') : `<div class="empty">Inga vägningar loggade än.</div>`;
}
function addBodyEntry(ev){
  ev.preventDefault();
  db.body.push({id:uid(),date:document.getElementById('b-date').value,weight:+document.getElementById('b-weight').value,note:document.getElementById('b-note').value});
  save(); renderBody(); renderDashboard(); toast('Vikt loggad ✓');
  return false;
}

// ---------- Statistik extra ----------
function renderStatsExtra(){
  const host=document.getElementById('view-stats');
  let el=document.getElementById('stats-extra');
  if(!el){ el=document.createElement('div'); el.id='stats-extra'; host.appendChild(el); }
  const now=new Date();
  const weeks=[];
  for(let i=7;i>=0;i--){
    const end=new Date(now); end.setDate(end.getDate()-7*i);
    const start=new Date(end); start.setDate(start.getDate()-7);
    const vol=db.workouts.filter(w=>{const d=new Date(w.date); return d>start&&d<=end;}).reduce((s,w)=>s+(w.exercises||[]).reduce((a,e)=>a+(e.sets*e.reps*e.weight||0),0),0);
    weeks.push(vol);
  }
  const mx=Math.max(...weeks,1);
  el.innerHTML=`
    <div class="grid2">
      <div class="card">
        <h3>Volym per vecka</h3>
        <div class="wchart">${weeks.map(v=>`<div class="col" style="height:${Math.max(4,Math.round(v/mx*100))}%" title="${v.toLocaleString('sv-SE')} kg"></div>`).join('')}</div>
        <div class="rowbetween" style="margin-top:8px;"><span class="label">8 veckor bakåt</span><span class="label">Denna vecka: ${weeks[7].toLocaleString('sv-SE')} kg</span></div>
      </div>
      <div class="card">
        <h3>1RM-kalkylator</h3>
        <div class="sub" style="margin-bottom:10px;">Uppskatta ditt max utifrån ett tungt set (Epley).</div>
        <div class="row">
          <input id="rm-weight" type="number" min="0" placeholder="Vikt (kg)" style="width:110px;">
          <input id="rm-reps" type="number" min="1" placeholder="Reps" style="width:80px;">
          <button class="btn" onclick="calc1RM()">Räkna</button>
        </div>
        <div id="rm-out" style="margin-top:12px;"></div>
      </div>
    </div>`;
}
function calc1RM(){
  const w=+document.getElementById('rm-weight').value, r=+document.getElementById('rm-reps').value;
  if(!w||!r){ toast('Fyll i vikt och reps.'); return; }
  const rm=w*(1+r/30);
  const rows=[100,95,90,85,80,75,70];
  document.getElementById('rm-out').innerHTML = `<div class="big" style="font-size:1.7rem;">${Math.round(rm)} kg</div>` +
    rows.map(p=>`<div class="rowbetween" style="padding:4px 0;"><span class="label">${p}% · ${p===100?'max':Math.round(r*p/100)+' reps'}</span><span>${Math.round(rm*p/100)} kg</span></div>`).join('');
}

// ---------- Vilotimer ----------
let restTimer=null, restLeft=0;
function restShow(show){
  let chip=document.getElementById('rest-chip');
  if(!chip){
    document.body.insertAdjacentHTML('beforeend', `<div id="rest-chip">
      <div class="row" style="gap:8px;flex-wrap:nowrap;">
        <b id="rest-display" style="font-size:1.15rem;min-width:52px;text-align:center;">0:00</b>
        <input id="rest-min" type="number" min="0" max="30" value="2" style="width:56px;" title="minuter">
        <button class="btn" onclick="restStart()" style="padding:7px 12px;">Start</button>
        <button class="btn ghost" onclick="restStop()" style="padding:7px 12px;">Nollställ</button>
        <button class="btn ghost" onclick="document.getElementById('rest-chip').classList.remove('show')" style="padding:7px 12px;">✕</button>
      </div>
      <div class="label" style="margin-top:4px;">Vilotimer</div>
    </div>`);
    chip=document.getElementById('rest-chip');
  }
  chip.classList.toggle('show', !!show);
}
function restStart(){
  restShow(true);
  const m=+document.getElementById('rest-min').value||0;
  restLeft=m*60; if(restLeft<=0) restLeft=120;
  if(restTimer) clearInterval(restTimer);
  restTimer=setInterval(restTick,1000); restTick();
}
function restTick(){
  const el=document.getElementById('rest-display');
  if(el) el.textContent = Math.floor(Math.max(0,restLeft)/60)+':'+String(Math.max(0,restLeft)%60).padStart(2,'0');
  if(restLeft<=0){ if(restTimer) clearInterval(restTimer); restTimer=null; toast('Vilan klar, kör vidare 💪'); return; }
  restLeft--;
}
function restStop(){
  if(restTimer) clearInterval(restTimer); restTimer=null; restLeft=0;
  const el=document.getElementById('rest-display'); if(el) el.textContent='0:00';
}

// ---------- Shared ----------
function togglePanel(id){ document.getElementById(id).classList.toggle('open'); }
function deleteItem(coll,id){ db[coll]=db[coll].filter(x=>x.id!==id); save(); renderAll(); }
function renderAll(){ renderDashboard(); renderJourney(); renderTraining(); renderGoals(); renderHabits(); renderDreams(); renderJournal(); renderGallery(); renderStats(); renderStatsExtra(); renderSettings(); renderProgram(); renderBody(); }

document.documentElement.dataset.theme = db.theme==='light' ? 'light' : 'dark';
renderCoachShell();
initSample();
restShow(false);
setView('dashboard');
document.querySelector('.navlink[data-view="dashboard"]')?.classList.add('active');

// ---------- Installera som app / hemskärmsikon ----------
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredInstallPrompt=e;
  const b=document.getElementById('install-app'); if(b) b.style.display='inline-flex';
});
const installBtn=document.getElementById('install-app');
if(installBtn) installBtn.addEventListener('click',async()=>{
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice;
    deferredInstallPrompt=null; installBtn.style.display='none';
  }else{
    alert('På iPhone/iPad: tryck på Dela i Safari och välj ”Lägg till på hemskärmen”. På Mac/Chrome: välj installera-ikonen i adressfältet om den visas.');
  }
});
window.addEventListener('appinstalled',()=>{ if(installBtn) installBtn.style.display='none'; });

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
