<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORWARD — Din utveckling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05050a; --bg2:#0a0a12; --card:#0e0e18; --card2:#151522;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16);
  --text:#f4f3f9; --muted:#a3a2b3; --label:#71708a;
  --accent:#7c83ff; --accent2:#9a7cff; --grad2:#4fd1ff;
  --accent-dim:rgba(124,131,255,.14);
  --good:#3ddc97; --bad:#ff6b7a; --warn:#ffc857; --danger:#ff6b7a; --text3:#8f8ea1;
  --font:'Inter',system-ui,sans-serif; --font-display:'Space Grotesk',system-ui,sans-serif;
  --radius:20px; --radius-s:12px;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  --glow:0 0 28px rgba(124,131,255,.35);
}
:root[data-theme="light"]{
  --bg:#f5f4ef; --bg2:#ffffff; --card:#ffffff; --card2:#f2f1ea;
  --border:rgba(20,20,40,.09); --border-strong:rgba(20,20,40,.18);
  --text:#18171e; --muted:#5f5e6e; --label:#8b8a99; --text3:#7b7a88;
  --accent:#555ad6; --accent-dim:rgba(85,90,214,.10);
  --shadow:0 10px 30px rgba(30,30,60,.08); --glow:none;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth; scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  line-height:1.55; height:100%; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,textarea,select{font-family:inherit; color:inherit;}
a{color:var(--accent); text-decoration:none;}
::selection{background:var(--accent-dim);}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:99px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Ambience ---------- */
#bg-aurora{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
#bg-aurora .blob{position:absolute; border-radius:50%; filter:blur(100px); opacity:.45;}
#bg-aurora .b1{width:560px; height:560px; background:radial-gradient(circle,#7c83ff,transparent 65%); top:-180px; left:-140px; animation:drift1 26s ease-in-out infinite alternate;}
#bg-aurora .b2{width:480px; height:480px; background:radial-gradient(circle,#4fd1ff,transparent 65%); bottom:-160px; right:-120px; animation:drift2 32s ease-in-out infinite alternate;}
#bg-aurora .b3{width:360px; height:360px; background:radial-gradient(circle,#9a7cff,transparent 65%); top:40%; left:55%; opacity:.3; animation:drift3 38s ease-in-out infinite alternate;}
[data-theme="light"] #bg-aurora .blob{opacity:.15;}
@keyframes drift1{to{transform:translate(70px,50px) scale(1.1);}}
@keyframes drift2{to{transform:translate(-60px,-40px) scale(1.12);}}
@keyframes drift3{to{transform:translate(-70px,36px) scale(.94);}}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
@keyframes popIn{from{opacity:0; transform:scale(.94);} to{opacity:1; transform:scale(1);}}

/* ---------- Shell ---------- */
#app{position:relative; z-index:1; display:flex; min-height:100vh;}
#sidebar{
  width:240px; flex-shrink:0; position:fixed; top:0; bottom:0; left:0; z-index:40;
  padding:26px 16px 20px; display:flex; flex-direction:column; gap:3px;
  background:rgba(10,10,18,.6); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-right:1px solid var(--border);
}
:root[data-theme="light"] #sidebar{background:rgba(255,255,255,.65);}
.brand{
  font-family:var(--font-display); font-weight:800; font-size:1.3rem; letter-spacing:.06em;
  padding:2px 10px 24px; display:flex; align-items:center; gap:9px;
  background:linear-gradient(120deg,var(--text) 30%,var(--accent));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.brand .dot{width:9px; height:9px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--grad2));
  box-shadow:0 0 12px rgba(124,131,255,.9); flex:none;}
.navlink{
  display:flex; align-items:center; gap:12px; padding:10px 13px; border-radius:12px;
  color:var(--muted); font-size:.92rem; font-weight:500; cursor:pointer;
  border:none; background:none; width:100%; text-align:left;
  transition:color .15s ease, background .15s ease; position:relative;
}
.navlink:hover{color:var(--text); background:var(--card2);}
.navlink.active{color:var(--text); background:var(--accent-dim); font-weight:600;}
.navlink.active::before{
  content:''; position:absolute; left:-16px; top:22%; bottom:22%; width:3px; border-radius:99px;
  background:linear-gradient(180deg,var(--accent),var(--grad2)); box-shadow:var(--glow);
}
.navlink svg{width:18px; height:18px; flex-shrink:0;}
#sidebar .bottom{margin-top:auto; padding-top:14px; border-top:1px solid var(--border);}
#bottomnav{
  display:none; position:fixed; left:10px; right:10px; bottom:10px; z-index:50;
  justify-content:space-around; padding:7px 4px; border-radius:20px;
  background:rgba(10,10,18,.8); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border); box-shadow:var(--shadow);
}
:root[data-theme="light"] #bottomnav{background:rgba(255,255,255,.85);}
#bottomnav .navlink{flex-direction:column; gap:3px; font-size:.6rem; padding:7px 6px; border-radius:14px; width:auto; color:var(--label);}
#bottomnav .navlink.active{color:var(--accent); background:transparent;}
#bottomnav .navlink.active::before{display:none;}
#bottomnav svg{width:20px; height:20px;}
main{position:relative; z-index:1; flex:1; min-width:0; margin-left:240px; padding:36px 44px 80px; max-width:1060px;}
@media(max-width:860px){
  #sidebar{display:none;}
  main{margin-left:0; padding:20px 16px 120px;}
  #bottomnav{display:flex;}
}
.view{display:none;}
.view.active{display:block; animation:fadeUp .35s ease;}

/* ---------- Type ---------- */
h1{font-family:var(--font-display); font-size:2.2rem; font-weight:800; letter-spacing:-.02em; margin:6px 0 2px;}
h2{font-family:var(--font-display); font-size:1.2rem; font-weight:700; letter-spacing:-.01em; margin:30px 0 0;}
h3{font-family:var(--font-display); font-size:.8rem; text-transform:uppercase; letter-spacing:.07em; color:var(--label); font-weight:600; margin:0 0 10px;}
h1 + .sub{margin-bottom:6px;}
.sub{color:var(--muted); font-size:.95rem; margin-top:4px;}
.date{color:var(--label); font-size:.8rem; text-transform:uppercase; letter-spacing:.14em; margin-bottom:2px;}
.big{font-family:var(--font-display); font-size:2rem; font-weight:800; letter-spacing:-.02em; line-height:1.2;}
.meta{color:var(--muted); font-size:.82rem;}
.title{font-weight:600;}
.label{color:var(--label); font-size:.8rem; margin-top:2px;}
.empty{color:var(--muted); padding:30px 14px; text-align:center; border:1px dashed var(--border-strong); border-radius:var(--radius); margin-top:16px; font-size:.9rem;}
.empty .btn{margin-top:12px;}

/* ---------- Cards & grids ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; margin-top:22px;}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px;}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:22px; margin-top:16px; box-shadow:var(--shadow);
  transition:border-color .2s ease, transform .2s ease;
}
.card:hover{border-color:var(--border-strong);}
.card h3{margin:0 0 10px;}
.hero-card{position:relative; overflow:hidden; background:linear-gradient(135deg,var(--card) 40%,rgba(124,131,255,.07));}
.hero-card::before{content:''; position:absolute; top:-45%; right:-12%; width:280px; height:280px;
  background:radial-gradient(circle,rgba(124,131,255,.16),transparent 70%); border-radius:50%; pointer-events:none;}
.list-item{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-top:14px;}
.list-item .meta{margin-top:2px;}

/* ---------- Buttons & forms ---------- */
.btn{
  font-family:var(--font-display); font-weight:600; font-size:.88rem;
  padding:11px 20px; border-radius:12px; border:none; cursor:pointer;
  background:linear-gradient(120deg,var(--accent),var(--accent2)); color:#fff;
  box-shadow:0 4px 16px rgba(124,131,255,.3);
  transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
}
.btn:hover{transform:translateY(-1px); box-shadow:0 6px 20px rgba(124,131,255,.4);}
.btn:active{transform:translateY(0);}
.btn.ghost{background:transparent; color:var(--text); border:1px solid var(--border-strong); box-shadow:none;}
.btn.ghost:hover{background:var(--card2); transform:none;}
.btn.danger{background:linear-gradient(120deg,#e0566a,#c74459); box-shadow:0 4px 16px rgba(224,86,106,.25);}
button{font-size:.9rem;}
input,select,textarea{
  font-size:.92rem; color:var(--text);
  background:var(--card2); border:1px solid var(--border); border-radius:11px; padding:11px 13px;
  outline:none; transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim);}
label{font-size:.76rem; color:var(--label); display:block; margin-bottom:5px; text-transform:uppercase; letter-spacing:.06em; font-weight:600;}
.field{margin-bottom:14px;}
.fieldrow{display:flex; gap:14px; flex-wrap:wrap;}
.fieldrow .field{flex:1; min-width:130px;}
.panel{
  display:none; margin-top:14px; padding:20px; border-radius:var(--radius);
  background:var(--card2); border:1px solid var(--border);
}
.panel.open{display:block; animation:fadeUp .25s ease;}
input[type=range]{accent-color:var(--accent); height:6px; padding:0; border:none; background:transparent;}
input[type=range]:focus{box-shadow:none;}

/* ---------- Bits ---------- */
.tag{
  display:inline-block; padding:4px 11px; border-radius:999px; font-size:.74rem; font-weight:500;
  background:var(--card2); border:1px solid var(--border); color:var(--muted); margin:2px 5px 2px 0;
}
.icobox{width:40px; height:40px; border-radius:13px; display:flex; align-items:center; justify-content:center;
  background:var(--accent-dim); color:var(--accent); margin-bottom:12px;}
.icobox svg{width:20px; height:20px;}
.pr-badge{
  display:inline-flex; align-items:center; gap:6px; font-size:.74rem; font-weight:700;
  background:var(--accent-dim); border:1px solid rgba(124,131,255,.3); color:var(--accent);
  padding:5px 13px; border-radius:999px; animation:popIn .4s ease;
}
.bar-track{background:var(--card2); border-radius:99px; height:9px; overflow:hidden; margin-top:6px; border:1px solid var(--border);}
.bar-fill{background:linear-gradient(90deg,var(--accent),var(--grad2)); height:100%; border-radius:99px;
  box-shadow:0 0 12px rgba(124,131,255,.5); transition:width .5s ease;}
.ring{transform:rotate(-90deg);}
.ring circle{fill:none; stroke-linecap:round;}
.heatmap{display:grid; grid-template-columns:repeat(10,1fr); gap:4px; margin-top:12px;}
.hm-cell{aspect-ratio:1; border-radius:4px; background:var(--card2);}
.hm-cell.on{background:linear-gradient(135deg,var(--accent),var(--grad2)); box-shadow:0 0 6px rgba(124,131,255,.6);}
.habit-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-top:14px;}
.weekbars{display:flex; gap:10px; align-items:flex-end; height:120px; margin-top:16px;}
.weekbars .bar{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:7px; height:100%;}
.weekbars .stick{width:100%; max-width:36px; border-radius:9px; background:var(--card2); border:1px solid var(--border); transition:height .4s ease;}
.weekbars .stick.on{background:linear-gradient(180deg,var(--accent),var(--grad2)); border-color:transparent; box-shadow:0 0 16px rgba(124,131,255,.4);}
.weekbars .lbl{font-size:.68rem; color:var(--label);}
.wchart{display:flex; align-items:flex-end; gap:8px; height:140px; margin-top:8px;}
.wchart .col{flex:1; border-radius:9px 9px 4px 4px; min-height:4px;
  background:linear-gradient(180deg,var(--accent),var(--grad2)); box-shadow:0 0 14px rgba(124,131,255,.3); transition:height .5s ease;}
.imgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:13px; margin-top:14px;}
.imgcard{border-radius:15px; overflow:hidden; background:var(--card2); border:1px solid var(--border); cursor:pointer; transition:transform .15s ease, border-color .15s ease;}
.imgcard:hover{transform:translateY(-2px); border-color:var(--border-strong);}
.imgcard img{width:100%; aspect-ratio:1; object-fit:cover; display:block;}
.imgcard .cap{padding:9px 11px; font-size:.78rem; color:var(--muted);}
.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; margin-top:16px;}
.badge{display:flex; flex-direction:column; align-items:center; gap:7px; padding:18px 10px;
  border-radius:16px; background:var(--card); border:1px solid var(--border); text-align:center;}
.badge.locked{opacity:.35; filter:grayscale(1);}
.badge .em{font-size:1.9rem; filter:drop-shadow(0 0 10px rgba(124,131,255,.5));}
.badge .t{font-size:.75rem; color:var(--muted); font-weight:600;}


/* ---------- Locked In ---------- */
.locked-card{background:linear-gradient(135deg,var(--card),rgba(124,131,255,.07)); border-color:rgba(124,131,255,.22);}
.lock-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:18px;}
.lock-day{min-width:0;min-height:92px;padding:10px 6px;border-radius:15px;border:1px solid var(--border);background:var(--card2);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:all .18s ease;}
.lock-day:hover{border-color:var(--border-strong);transform:translateY(-1px);}
.lock-day.locked{background:linear-gradient(145deg,var(--accent-dim),rgba(79,209,255,.10));border-color:rgba(124,131,255,.5);color:var(--text);box-shadow:0 0 18px rgba(124,131,255,.16);}
.lock-check{font-size:1.45rem;font-weight:800;line-height:1;color:var(--label);}
.lock-day.locked .lock-check{color:var(--good);}
.lock-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
.lock-date{font-family:var(--font-display);font-size:1rem;font-weight:800;color:var(--text);}
.locked-hint{margin-top:11px;color:var(--label);font-size:.72rem;text-align:center;}
@media(max-width:600px){.lock-week{gap:5px}.lock-day{min-height:82px;padding:8px 3px}.lock-label{font-size:.6rem}.lock-date{font-size:.9rem}}

/* ---------- Timeline ---------- */
.timeline{position:relative; margin-top:18px; padding-left:28px;}
.timeline::before{content:''; position:absolute; left:8px; top:4px; bottom:4px; width:2px; background:var(--border-strong);}
.tl-year{font-family:var(--font-display); font-size:1.15rem; font-weight:800; color:var(--accent); margin:24px 0 8px;}
.tl-year:first-child{margin-top:0;}
.tl-item{position:relative; padding:9px 0; color:var(--muted);}
.tl-item::before{content:''; position:absolute; left:-24px; top:16px; width:9px; height:9px; border-radius:50%;
  background:var(--accent); box-shadow:0 0 0 3px var(--bg);}
.tl-item .tl-date{font-size:.7rem; color:var(--label); text-transform:uppercase; letter-spacing:.08em;}

/* ---------- FAB, toast, lightbox ---------- */
.fab{
  position:fixed; right:24px; bottom:24px; width:58px; height:58px; border-radius:50%; border:none;
  font-size:1.6rem; cursor:pointer; z-index:60; color:#fff;
  background:linear-gradient(120deg,var(--accent),var(--accent2));
  box-shadow:0 8px 26px rgba(124,131,255,.5);
  display:flex; align-items:center; justify-content:center;
  transition:transform .2s ease;
}
.fab:hover{transform:scale(1.06) rotate(90deg);}
@media(min-width:861px){ .fab{bottom:28px; right:28px;} }
@media(max-width:860px){ .fab{right:18px; bottom:calc(84px + env(safe-area-inset-bottom,0px));} }
.fab-menu{position:fixed; right:24px; bottom:96px; display:none; flex-direction:column; gap:7px; z-index:60;}
.fab-menu.open{display:flex; animation:fadeUp .2s ease;}
.fab-menu button{
  padding:12px 18px; border-radius:14px; border:1px solid var(--border-strong);
  background:var(--card2); color:var(--text); cursor:pointer;
  font-size:.86rem; font-weight:500; box-shadow:var(--shadow); text-align:left; white-space:nowrap;
  transition:border-color .15s ease;
}
.fab-menu button:hover{border-color:var(--accent);}
@media(min-width:861px){ .fab-menu{bottom:100px; right:28px;} }
@media(max-width:860px){ .fab-menu{right:18px; bottom:calc(152px + env(safe-area-inset-bottom,0px));} }
#toast-wrap{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:200; align-items:center; pointer-events:none;}
@media(max-width:860px){ #toast-wrap{bottom:calc(160px + env(safe-area-inset-bottom,0px));} }
.toast{
  padding:12px 20px; border-radius:13px; background:var(--card2); border:1px solid var(--border-strong);
  color:var(--text); box-shadow:var(--shadow); font-size:.88rem; font-weight:500;
  animation:fadeUp .25s ease; white-space:nowrap;
}
#lightbox{position:fixed; inset:0; background:rgba(4,4,9,.93); display:none; align-items:center; justify-content:center; z-index:300; backdrop-filter:blur(6px);}
#lightbox.open{display:flex;}
#lightbox img{max-width:92vw; max-height:86vh; border-radius:16px; box-shadow:var(--shadow);}
#lightbox .close{position:fixed; top:18px; right:22px; background:var(--card2); border:1px solid var(--border-strong); color:var(--text); width:44px; height:44px; border-radius:50%; font-size:1.1rem; cursor:pointer;}

/* ---------- Rest chip ---------- */
#rest-chip{position:fixed; left:16px; bottom:88px; z-index:70; background:var(--card2); border:1px solid var(--border-strong);
  border-radius:18px; padding:12px 16px; box-shadow:var(--shadow); display:none;}
#rest-chip.show{display:block;}
#rest-chip .row{flex-wrap:nowrap;}
@media(min-width:861px){ #rest-chip{left:26px; bottom:26px;} }
@media(max-width:860px){ #rest-chip{left:14px; bottom:calc(84px + env(safe-area-inset-bottom,0px));} }

@media(prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important;}
  html{scroll-behavior:auto;}
}

/* ---------- Kalender: träningsmarkering per dag ---------- */
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-h{text-align:center; font-size:.72rem; font-weight:700; color:var(--text3); padding:4px 0;}
.cal-d{aspect-ratio:1; border-radius:12px; border:1px solid var(--border); background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:.82rem; cursor:pointer; color:var(--text); padding:0; font-family:inherit;}
.cal-d:hover{border-color:var(--border-strong);}
.cal-d.on{background:var(--accent-dim); border-color:var(--accent); color:var(--accent); font-weight:700;}
.cal-d.today{box-shadow:0 0 0 2px var(--accent-dim); border-color:var(--accent2);}

/* Animerad bakgrund */
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.bgfx span{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 24s ease-in-out infinite alternate;}
.bgfx .b1{width:46vmax;height:46vmax;left:-14vmax;top:-16vmax;background:radial-gradient(circle,rgba(124,131,255,.7),transparent 68%);}
.bgfx .b2{width:40vmax;height:40vmax;right:-16vmax;top:22vh;background:radial-gradient(circle,rgba(79,209,255,.5),transparent 68%);animation-duration:30s;animation-delay:-9s;}
.bgfx .b3{width:36vmax;height:36vmax;left:16vw;bottom:-18vmax;background:radial-gradient(circle,rgba(154,124,255,.6),transparent 68%);animation-duration:36s;animation-delay:-18s;}
@keyframes drift{
  0%{transform:translate(0,0) scale(1);}
  50%{transform:translate(6vmax,4vmax) scale(1.12);}
  100%{transform:translate(-4vmax,-5vmax) scale(.94);}
}
:root[data-theme="light"] .bgfx span{opacity:.28;}
@media (prefers-reduced-motion: reduce){.bgfx span{animation:none;}}
</style>
