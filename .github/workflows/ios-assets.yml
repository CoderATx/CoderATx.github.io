name: iOS assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rsvg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin

      - name: Render PNG icons from icon.svg
        run: |
          rsvg-convert -w 180 -h 180 icon.svg -o apple-touch-icon.png
          rsvg-convert -w 192 -h 192 icon.svg -o icon-192.png
          rsvg-convert -w 512 -h 512 icon.svg -o icon-512.png

      - name: Wire iOS mode into index.html and manifest
        run: |
          python3 - <<'PY'
          import json, io

          html = io.open('index.html', encoding='utf-8').read()
          before = html

          html = html.replace('<link rel="apple-touch-icon" href="icon.svg">',
                              '<link rel="apple-touch-icon" href="apple-touch-icon.png">')

          if 'ios.js' not in html:
              html = html.replace('</body>', '<script src="ios.js" defer></script>\n</body>', 1)

          if html != before:
              io.open('index.html', 'w', encoding='utf-8').write(html)

          m = json.load(io.open('manifest.json', encoding='utf-8'))
          m['icons'] = [
              {"src": "icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any"},
              {"src": "icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any"},
              {"src": "icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable"},
              {"src": "icon.svg", "sizes": "any", "type": "image/svg+xml", "purpose": "any"}
          ]
          io.open('manifest.json', 'w', encoding='utf-8').write(json.dumps(m, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "iOS icons and wiring [skip ci]"
          git push
